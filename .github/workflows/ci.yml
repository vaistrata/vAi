name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

# pull-requests:read — the paths filter lists a PR's changed files by API.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Job-level `if:` rather than a workflow-level `paths:` — a skipped job still
  # reports, so a required check does not hang. A skipped workflow reports
  # nothing and leaves the PR pending forever.
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `every` makes the pattern list a conjunction, so these negations
          # read "none of the below" — a lone !(a|b) extglob does not: probed
          # with an md-only PR, it matched README.md and built everything.
          # Negated, so anything unrecognised still builds. The python build
          # compiles the C++ core too, so `code` is `cpp` plus python/**.
          predicate-quantifier: every
          filters: |
            cpp:
              - '!python/**'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!**/*.md'
            code:
              - '!docs/**'
              - '!mkdocs.yml'
              - '!**/*.md'

  # Style check on the lines a PR changes, not on whole files: the tree
  # predates the formatter, so a whole-file check would fail on code the PR
  # never touched. git clang-format formats only the hunks between the merge
  # base and HEAD; ruff gets the changed .py files. pull_request only — a push
  # has no base to diff against, and a skipped job still reports its check.
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}     # env, not inline: no template injection in run:
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                   # the merge base must be reachable

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Versions pinned here and nowhere else; .clang-format tracks this one.
      # The clang-format wheel ships git-clang-format as a console script.
      - name: Install
        run: |
          pip install clang-format==21.1.8 ruff==0.17.4
          clang-format --version

      # The pathspecs mirror .clang-format-ignore. git clang-format honours that
      # file too, so this is a second fence that also keeps the diff small.
      # Exit codes: 0 clean, 1 formatting differs (git diff --exit-code), 2 error.
      - name: clang-format (changed lines)
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          set +e
          git clang-format --diff --extensions h,hpp,cpp "$base" -- \
            . ':!external' ':!vai/shaders' \
            ':!vai/utils/stb_image.h' ':!vai/utils/stb_image_write.h' ':!vai/utils/tiny-json.h'
          rc=$?
          set -e
          case $rc in
            0) echo "clang-format: clean" ;;
            1) echo "::error::clang-format: run 'git clang-format $base' locally and commit the result"; exit 1 ;;
            *) echo "::error::git clang-format failed (exit $rc)"; exit $rc ;;
          esac

      - name: ruff format (changed files)
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          files=$(git diff --name-only --diff-filter=ACMR "$base" -- '*.py' ':!external')
          if [ -z "$files" ]; then echo "ruff: no python changes"; exit 0; fi
          ruff format --check --diff $files

      # The whole tree, unlike the format steps: the rules in pyproject.toml are
      # few and the tree passes them, so a finding is always the PR's own.
      - name: ruff check
        run: ruff check --output-format=github .

  # clang-tidy reads a source as the compiler does, so it needs the compile
  # database: a configure, not a build. Only the lines a PR changes can fail it
  # (.github/scripts/clang-tidy-changed.py). A manual run lists every finding
  # of the tree and fails on none.
  tidy:
    needs: filter
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.filter.outputs.cpp == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-14
      CXX: g++-14
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0                   # the merge base must be reachable

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build glslc libvulkan-dev spirv-headers
          pip install clang-tidy==22.1.8
          clang-tidy --version

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVAI_BUILD_EXAMPLES=ON

      - name: clang-tidy (changed lines)
        if: github.event_name == 'pull_request'
        run: python .github/scripts/clang-tidy-changed.py --build build --base "origin/$BASE_REF"

      - name: clang-tidy (whole tree, report only)
        if: github.event_name == 'workflow_dispatch'
        run: python .github/scripts/clang-tidy-changed.py --build build --all

  vai-linux:
    needs: filter
    if: github.event_name == 'workflow_dispatch' || needs.filter.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # `this auto&&` (C++23 explicit object parameters) needs GCC 14; the
    # runner's default gcc is 13.
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build glslc libvulkan-dev spirv-headers

      - uses: hendrikmuhs/ccache-action@v1.2.23   # `v1` still ships node20
        with:
          key: build-ubuntu-24.04
          save: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # VAI_BUILD_BENCH compiles the vAi-side benches; the comparison targets
      # need their runtimes and are skipped on a bare runner by find_package.
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVAI_BUILD_EXAMPLES=ON \
            -DVAI_BUILD_BENCH=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"

  vai-windows:
    needs: filter
    if: github.event_name == 'workflow_dispatch' || needs.filter.outputs.cpp == 'true'
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      VULKAN_SDK_VERSION: 1.4.357.0

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      # A restored cache does not set VULKAN_SDK, which FindVulkan needs.
      # Probe a file the install ends on, not the directory — a failed install
      # can leave a partial directory behind, and the cache would pin it.
      - name: Vulkan SDK
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) {
            curl.exe -L -o "$env:RUNNER_TEMP\vulkan-sdk.exe" `
              "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
            & "$env:RUNNER_TEMP\vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV

      # Ninja needs cl.exe on PATH; the VS generator set it up on its own.
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja

      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache            # ccache cannot wrap MSVC cl.exe
          key: build-windows-2025
          save: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Ninja Multi-Config keeps the multi-config coverage the VS generator gave,
      # and is the only multi-config generator that honours a compiler launcher.
      - name: Build
        run: |
          cmake -B build -G "Ninja Multi-Config" `
            -DVAI_BUILD_EXAMPLES=ON `
            -DVAI_BUILD_BENCH=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --config Release

  # Keyed off `code`, not a python-only filter: pip builds the C++ core into
  # the extension, so a C++ change can break the bindings without touching
  # python/**.
  pyvai-linux:
    needs: filter
    if: github.event_name == 'workflow_dispatch' || needs.filter.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The C++ core needs GCC 14, as in vai-linux; pip's CMake reads CC / CXX too.
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # mesa-vulkan-drivers is lavapipe, the only ICD on a GPU-less runner.
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build glslc libvulkan-dev spirv-headers mesa-vulkan-drivers

      # ubuntu-24.04's system python is PEP 668 externally-managed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip                  # wheel downloads; the build itself is ccache's job
          cache-dependency-path: pyproject.toml

      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: python-ubuntu-24.04
          save: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # torch is the tests' numeric reference. The CPU index first, so the
      # [test] extra finds it installed instead of pulling the CUDA build.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]" \
            --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Tests without committed weights skip themselves.
      - name: Test
        run: pytest -q
