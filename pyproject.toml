[build-system]
# nanobind 3 dropped Python 3.9; <4 is the last major verified.
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0,<3; python_version < '3.10'",
    "nanobind>=2.0,<4; python_version >= '3.10'",
]
build-backend = "scikit_build_core.build"


[project]
name            = "pyvai"
dynamic         = ["version"]                       # single-sourced from python/pyvai/__init__.py
description     = "Python bindings for the vAi engine"
readme          = "python/README.md"
license         = { text = "Apache-2.0" }           # same as the repo-root LICENSE
authors         = [{ name = "vAiStrata" }]
keywords        = ["vulkan", "inference", "neural-network", "gpu", "nanobind"]
requires-python = ">=3.9,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
# torch is the numeric reference in python/tests only; pyvai never imports it.
# Install the CPU build first, or pip pulls the CUDA one (several GB):
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
test = ["pytest", "torch"]

[project.urls]
Homepage = "https://vaistrata.com"
Issues   = "https://github.com/vaistrata/vAi/issues"


[tool.scikit-build]
minimum-version    = "0.10"
cmake.version      = ">=3.16"
cmake.build-type   = "Release"
build-dir          = "build/{wheel_tag}"
wheel.packages     = ["python/pyvai"]
install.components = ["python"]

[tool.scikit-build.cmake.define]
VAI_BUILD_PYTHON   = "ON"
VAI_BUILD_EXAMPLES = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input    = "python/pyvai/__init__.py"
regex    = '''__version__\s*(?::\s*str)?\s*=\s*["'](?P<value>[^"']+)["']'''

[tool.pytest.ini_options]
# importlib: test files in different folders may share a name (a core node's
# and a model's); pythonpath makes python/tests/node_check.py importable.
addopts = ["--import-mode=importlib"]
pythonpath = ["python/tests"]
# Tests import the editable install — run `pip install -e .` first.
testpaths = ["python/tests"]
