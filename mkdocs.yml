site_name: vAi                                  # Tab title and the name next to the top-left logo
# <meta description>, shown by search engines and link previews. This is the
# text of the default locale (en). The Korean text is
# languages[locale: ko].site_description under the i18n plugin.
site_description: Vulkan inference engine built on a graph DSL
repo_url: https://github.com/vaistrata/vAi      # Repository link at the top right
repo_name: vAi                                  # Text shown for that link
edit_uri: edit/master/docs/                     # Path the "edit this page" button points to

theme:
  name: material
  # The i18n plugin sets the UI language per locale, so it is not fixed here.
  features:
    # navigation.instant stays off. With it on, the language selector in the
    # header can only go to the first page of the other language, not to the
    # other-language version of the page being read (the i18n plugin warns
    # about this at build time). Keeping the page matters more.
    - navigation.tracking                       # Updates the anchor in the address bar while scrolling
    - navigation.top                            # "Back to top" button
    - navigation.indexes                        # Lets a section title have a page of its own (see nav)
    - content.code.copy                         # Copy button on code blocks
    # content.action.edit stays off for now. It adds a pencil button to every
    # page that opens the GitHub edit screen. Turn it on when the project is
    # ready to take outside contributions.
    - search.suggest                            # Search suggestions
  # There is one palette only. website/DESIGN.md covers the dark canvas alone
  # and leaves the light palette as a "Known Gap" (the brand ink color, ember,
  # is 2.9:1 on white). No palette is invented here, so there is no toggle.
  # custom means extra.css sets the colors, not the theme.
  palette:
    scheme: slate
    primary: custom
    accent: custom

  # Stops the theme from loading Roboto from Google Fonts.
  # extra.css sets the typeface to the Archivo files in this repository.
  font: false

# Order and names of the left menu. Languages are not split here: each language
# has its own nav at the top level, and the language selector at the right of
# the header switches between them (the i18n plugin below). This nav belongs to
# the default locale (en). The Korean nav is languages[locale: ko].nav under
# the i18n plugin.
#
# The two languages have the same files, one to one. When a chapter is added to
# one, change the other as well.
nav:
  - Overview: en/index.md
  - Quickstart: en/02-quickstart.md
  - Using vAi:
      - en/03-usage/README.md                   # An entry without a name is the page that opens when the section title is clicked
      - Node: en/03-usage/node.md
      - NodeGroup: en/03-usage/node-group.md
      - NeuralNet: en/03-usage/neural-net.md
      - Tensor: en/03-usage/tensor.md
      - Execution pipeline summary: en/03-usage/execution-pipeline.md
      - Profiling: en/03-usage/profiling.md
  - Supported models:
      - en/04-models/README.md
      - YOLOX: en/04-models/yolox.md
      - GPT-2: en/04-models/gpt2.md
      - Llama 3: en/04-models/llama3.md
      - Gemma 3: en/04-models/gemma3.md
  - Built-in nodes: en/06-nodes.md
  - Contributing:
      - en/contributing/README.md               # Contribution workflow and automated checks
      - Writing custom models: en/contributing/models.md
      - Writing custom nodes and kernels: en/contributing/nodes.md
      - Writing custom groups: en/contributing/groups.md
  - Vulkan basic concepts: en/09-vulkan-objects.md

# A file under docs/ gets a page and is searchable even when it is not in nav.
# Everything is published, and only what is hidden is listed (.gitignore syntax).
# internals holds internal documents; tools and requirements.txt are build machinery.
exclude_docs: |
  /internals/
  /tools/
  /requirements.txt

# Styles laid over the theme. The document sources are not touched.
extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition                                  # !!! note call-out boxes
  - attr_list                                   # Attributes on elements with {: .class }
  - md_in_html                                  # Processes Markdown inside HTML tags too
  - tables                                      # Tables

  # The default slugify drops Unicode, so Korean headings become _1, _2.
  # GitHub keeps Korean anchors as they are, and this slugify makes the site match.
  - toc:
      permalink: true                           # ¶ link next to each heading
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - pymdownx.details                            # Collapsible blocks with ???
  - pymdownx.superfences:                       # Allows nested code blocks
      custom_fences:
        # Renders ```mermaid as a diagram, not as code
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true                     # A linkable anchor on each line number
  - pymdownx.inlinehilite                       # Syntax highlighting for inline code too
  - pymdownx.snippets                           # Inserts pieces of other files with --8<--

plugins:
  # Full-text search (the index is built into the output). lang is not set:
  # the i18n plugin rebuilds the index per locale and fills in the matching lang.
  - search

  # Builds the site once per language. docs/en goes to the site root (/) and
  # docs/ko under /ko/, and a selector for the two languages appears at the
  # right of the header. The folder name is the locale code, so it has to be
  # ko/en, not kor/eng.
  #
  # To change the default locale, move default: true and swap the two navs and
  # the two site_description values (the top-level ones belong to the default
  # locale). The addresses move with it: the default locale sits at / and the
  # others at /<locale>/, so /ko/ and /en/ trade places. Update the links that
  # point to this site from outside as well.
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
        - locale: ko
          name: 한국어
          site_description: 그래프 DSL 기반 Vulkan 추론 엔진
          nav:
            - 개요: ko/index.md
            - 빠른 실행: ko/02-quickstart.md
            - vAi 사용법:
                - ko/03-usage/README.md
                - 노드(Node): ko/03-usage/node.md
                - 노드그룹(NodeGroup): ko/03-usage/node-group.md
                - 신경망(NeuralNet): ko/03-usage/neural-net.md
                - 텐서(Tensor): ko/03-usage/tensor.md
                - 실행 파이프라인 요약: ko/03-usage/execution-pipeline.md
                - 프로파일링: ko/03-usage/profiling.md
            - 제공 모델:
                - ko/04-models/README.md
                - YOLOX: ko/04-models/yolox.md
                - GPT-2: ko/04-models/gpt2.md
                - Llama 3: ko/04-models/llama3.md
                - Gemma 3: ko/04-models/gemma3.md
            - 제공 노드들: ko/06-nodes.md
            - 기여하기:
                - ko/contributing/README.md
                - 커스텀 모델 작성: ko/contributing/models.md
                - 커스텀 노드와 커널 작성: ko/contributing/nodes.md
                - 커스텀 그룹 작성: ko/contributing/groups.md
            - Vulkan 기본 개념: ko/09-vulkan-objects.md

# Regenerates chapter 6 from the header stamps on every build.
hooks:
  - docs/tools/mkdocs_hook.py

# The hook runs only when a build happens, so serve watches the node headers
# too. docs/ and mkdocs.yml are watched by default and are not listed.
watch:
  - vai/nodes

# The documents are read on GitHub first and on the site second. Links that go
# out to ../vai and ../models work on GitHub, but the site has no target for
# them and reports not_found. Once repo_url is settled, change them to absolute
# URLs and remove this exception.
validation:
  links:
    not_found: ignore
  nav:
    omitted_files: ignore                       # No warning when a document is not in nav
